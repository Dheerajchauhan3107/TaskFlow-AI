<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <header>
        <h1>🚀 TaskFlow AI</h1>
        <p>Smart Task Management System</p>
    </header>

    <section class="cards">

        <div class="card">
            <h2>📋 Total Tasks</h2>
            <span>{{ tasks|length }}</span>
        </div>

        <div class="card">
            <h2>✅ Completed</h2>
            <span>0</span>
        </div>

        <div class="card">
            <h2>⏳ Pending</h2>
            <span>{{ tasks|length }}</span>
        </div>

    </section>

    <section class="add-task">

        <form action="/add" method="POST">

            <input
                type="text"
                name="task"
                placeholder="Enter your task..."
                required>

            <button type="submit" class="add-btn">
                ➕ Add Task
            </button>

        </form>

    </section>

    <section class="task-section">

        <h2>Your Tasks</h2>

        {% if tasks %}

            {% for task in tasks %}

            <div class="task-card">

                <div class="task-left">

                    <input type="checkbox">

                    <span>{{ task }}</span>

                </div>

                <a href="{{ url_for('delete', index=loop.index0) }}" class="delete-btn">
                    🗑 Delete
                </a>

            </div>

            {% endfor %}

        {% else %}

            <div class="task-card">

                <p>No Tasks Available. Add your first task!</p>

            </div>

        {% endif %}

    </section>

</div>

</body>

</html>
