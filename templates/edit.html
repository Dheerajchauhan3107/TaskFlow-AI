<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task | TaskFlow AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <header class="page-header">

            <div class="header-actions">

                <button id="darkModeToggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"
                    aria-pressed="false">

                    🌙 Dark Mode

                </button>

            </div>

            <h1>✏️ Edit Task</h1>

            <p>Update your task details below.</p>

        </header>

        <section class="add-task">

            <form action="{{ url_for('edit', id=task.id) }}" method="POST">

                <input type="text" name="task" value="{{ task.title }}" placeholder="Enter updated task..." required
                    autofocus>

                <div class="actions">

                    <button type="submit" class="add-btn">
                        💾 Update Task
                    </button>

                    <a href="{{ url_for('home') }}" class="cancel-btn">
                        ❌ Cancel
                    </a>

                </div>

            </form>

        </section>

    </div>

</body>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</html>
